<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shark Invite</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="bubbles"></div>

<div id="invite-text">
  <h1>You're Invited!</h1>
  <p>Dive in with the sharks and sea turtles to celebrate JACK'S 5th birthday!</p>
  <p>September 12th at 3:30pm - 5:30pm</p>
  <p>Location: Chuck E. Cheese in Urbana</p>
  <p> Look for the grey building by the playground and pool!🦈</p>
  <button id="startBtn">Start</button>
</div>

<div id="rsvp-form" style="display:none;">
  <h2>RSVP</h2>
  <form action="https://formspree.io/f/mgvzrklb" method="POST">
    <label>Your Name:
      <input type="text" name="name" required />
    </label><br /><br />

    <label>Will you attend?
      <select name="rsvp" required>
        <option value="">Select...</option>
        <option value="Yes">Yes, I’ll be there!</option>
        <option value="No">Sorry, can’t make it</option>
      </select>
    </label><br /><br />

    <label>Message (optional):
      <textarea name="message" rows="3"></textarea>
    </label><br /><br />

    <button type="submit">Send RSVP</button>
  </form>
</div>

<audio id="bgMusic" src="little_mermaid_theme.mp3" preload="auto" loop></audio>
<button id="playMusicBtn">Play Music</button>

<script src="script.js"></script>

</body>
</html>
